<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Notice - ScamLens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5 my-4">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9 text-center">
            <div class="cyber-card cyber-card-glow p-5">
                <div class="mb-4">
                    <span class="d-inline-flex p-3 rounded-circle bg-danger bg-opacity-10 border border-danger text-danger mb-3" style="font-size: 2.5rem;">
                        <i class="fa-solid fa-shield-virus"></i>
                    </span>
                    <h2 class="text-white fw-bold mb-2">Notice & Threat Isolation</h2>
                    <p class="text-secondary small mb-0">The requested resource could not be processed or requires valid authentication credentials.</p>
                </div>

                <div class="p-3 rounded bg-dark border border-secondary text-start mb-4 small font-monospace">
                    <div class="d-flex justify-content-between mb-1">
                        <span class="text-muted">Status Code:</span>
                        <span class="text-danger fw-bold" th:text="${status != null ? status : '500'}">500</span>
                    </div>
                    <div class="d-flex justify-content-between mb-1">
                        <span class="text-muted">Error Type:</span>
                        <span class="text-warning" th:text="${error != null ? error : 'Internal Server Error'}">Internal Server Error</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Message:</span>
                        <span class="text-secondary" th:text="${message != null ? message : 'Authentication required or session expired.'}">An unexpected condition was encountered.</span>
                    </div>
                </div>

                <div class="d-flex flex-wrap justify-content-center gap-3">
                    <a th:href="@{/login}" class="btn btn-cyber px-4 py-2">
                        <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Sign In to Account
                    </a>
                    <a th:href="@{/scanner}" class="btn btn-cyber-outline px-4 py-2">
                        <i class="fa-solid fa-crosshairs me-1"></i> Open Threat Scanner
                    </a>
                    <a th:href="@{/}" class="btn btn-outline-secondary px-3 py-2">
                        <i class="fa-solid fa-house me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
