<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ScamLens Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="cyber-card cyber-card-glow p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="brand-icon d-inline-block mb-3 fs-3 p-3"><i class="fa-solid fa-user-shield"></i></span>
                    <h3 class="text-white fw-bold">Join ScamLens</h3>
                    <p class="text-secondary small">Create your cybersecurity account to store scan records & reports</p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger py-2 small cyber-card mb-3" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-1"></i> <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label small text-secondary fw-semibold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="e.g. Alex Hunter" required>
                        </div>
                        <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small text-secondary fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="name@domain.com" required>
                        </div>
                        <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small text-secondary fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="At least 6 characters" required>
                        </div>
                        <small class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label small text-secondary fw-semibold">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Repeat password" required>
                        </div>
                        <small class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
                    </div>

                    <button type="submit" class="btn btn-cyber w-100 py-2 fs-6 mb-3">
                        <i class="fa-solid fa-user-plus me-2"></i> Register Account
                    </button>
                </form>

                <div class="text-center pt-2 border-top border-secondary small">
                    <span class="text-secondary">Already registered?</span>
                    <a th:href="@{/login}" class="text-info text-decoration-none fw-semibold ms-1">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
