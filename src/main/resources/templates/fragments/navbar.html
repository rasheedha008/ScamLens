<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <span class="brand-icon"><i class="fa-solid fa-shield-halved"></i></span>
            <span>Scam<span style="color: var(--accent-cyan);">Lens</span></span>
        </a>

        <button class="navbar-toggler text-light border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fa-solid fa-bars" style="color: var(--accent-cyan);"></i>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link d-inline-flex align-items-center" th:href="@{/scanner}">
                        <svg class="scanner-header-icon me-1" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" stroke="var(--accent-cyan)" stroke-opacity="0.45"></circle>
                            <circle cx="12" cy="12" r="6" stroke="var(--accent-cyan)" stroke-opacity="0.85"></circle>
                            <circle cx="12" cy="12" r="2" fill="var(--accent-cyan)"></circle>
                            <line x1="12" y1="12" x2="20" y2="4" stroke="var(--accent-cyan)" stroke-width="2.2"></line>
                        </svg>
                        <span>Scanner</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/compare}"><i class="fa-solid fa-code-compare me-1"></i> Compare</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/awareness}"><i class="fa-solid fa-book-bookmark me-1"></i> Intelligence</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}"><i class="fa-solid fa-circle-info me-1"></i> About</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto align-items-lg-center">
                <!-- If Logged In -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="fa-solid fa-gauge-high me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/history}"><i class="fa-solid fa-clock-rotate-left me-1"></i> History</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" id="userDrop" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa-solid fa-circle-user text-info"></i>
                        <span sec:authentication="name">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end cyber-card" aria-labelledby="userDrop">
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="fa-solid fa-user-gear me-2"></i> Account Profile</a></li>
                        <li><hr class="dropdown-divider border-secondary"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                <button type="submit" class="dropdown-item text-danger"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Sign Out</button>
                            </form>
                        </li>
                    </ul>
                </li>

                <!-- If Guest -->
                <li class="nav-item me-2" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}"><i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Sign In</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-cyber" th:href="@{/register}"><i class="fa-solid fa-user-plus me-1"></i> Get Started</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
