<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Profile - ScamLens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4 my-2">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Header -->
            <div class="d-flex align-items-center gap-3 mb-4 border-bottom border-secondary pb-3">
                <span class="brand-icon fs-3 p-3"><i class="fa-solid fa-user-gear"></i></span>
                <div>
                    <h2 class="text-white fw-bold mb-0">Account Profile & Settings</h2>
                    <p class="text-secondary small mb-0">Manage your profile credentials and security configuration</p>
                </div>
            </div>

            <!-- Profile Summary Card -->
            <div class="cyber-card p-4 mb-4">
                <h5 class="text-white mb-3"><i class="fa-solid fa-id-card text-info me-2"></i> Account Overview</h5>
                <div class="row g-3">
                    <div class="col-sm-6">
                        <small class="text-muted d-block">Full Legal Name</small>
                        <span class="fw-bold text-white fs-6" th:text="${profile.name}">Alex Hunter</span>
                    </div>
                    <div class="col-sm-6">
                        <small class="text-muted d-block">Registered Email</small>
                        <span class="fw-bold text-info fs-6" th:text="${profile.email}">alex@example.com</span>
                    </div>
                    <div class="col-sm-6">
                        <small class="text-muted d-block">Account Created</small>
                        <span class="text-secondary small" th:text="${#temporals.format(profile.memberSince, 'yyyy-MM-dd HH:mm')}">2026-11-06</span>
                    </div>
                    <div class="col-sm-6">
                        <small class="text-muted d-block">Total Scans Executed</small>
                        <span class="fw-bold text-white fs-6" th:text="${profile.totalScans} + ' Scans'">0 Scans</span>
                    </div>
                </div>
            </div>

            <!-- Profile Update Form -->
            <div class="cyber-card p-4">
                <h5 class="text-white mb-3"><i class="fa-solid fa-key text-warning me-2"></i> Update Profile & Password</h5>

                <div id="profileAlertBox"></div>

                <form id="profileForm" onsubmit="event.preventDefault(); updateProfile();">
                    <div class="mb-3">
                        <label for="profileName" class="form-label small text-secondary fw-semibold">Display Name</label>
                        <input type="text" class="form-control" id="profileName" th:value="${profile.name}" required>
                    </div>

                    <hr class="border-secondary my-4">
                    <h6 class="text-white small fw-bold mb-3"><i class="fa-solid fa-lock text-info me-1"></i> Change Password (Optional)</h6>

                    <div class="mb-3">
                        <label for="currentPassword" class="form-label small text-secondary fw-semibold">Current Password</label>
                        <input type="password" class="form-control" id="currentPassword" placeholder="Enter existing password to verify">
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="newPassword" class="form-label small text-secondary fw-semibold">New Password</label>
                            <input type="password" class="form-control" id="newPassword" placeholder="Minimum 6 characters">
                        </div>
                        <div class="col-md-6">
                            <label for="confirmNewPassword" class="form-label small text-secondary fw-semibold">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirmNewPassword" placeholder="Repeat new password">
                        </div>
                    </div>

                    <button type="submit" id="saveProfileBtn" class="btn btn-cyber">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

<script>
    async function updateProfile() {
        const name = document.getElementById('profileName').value.trim();
        const curPass = document.getElementById('currentPassword').value;
        const newPass = document.getElementById('newPassword').value;
        const confPass = document.getElementById('confirmNewPassword').value;
        const btn = document.getElementById('saveProfileBtn');

        if (newPass && newPass.length < 6) {
            ScamLens.showAlert('profileAlertBox', 'New password must be at least 6 characters.', 'warning');
            return;
        }

        if (newPass && newPass !== confPass) {
            ScamLens.showAlert('profileAlertBox', 'New passwords do not match.', 'danger');
            return;
        }

        btn.disabled = true;

        try {
            const res = await fetch('/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: name,
                    currentPassword: curPass,
                    newPassword: newPass,
                    confirmPassword: confPass
                })
            });

            const data = await res.json();
            if (res.ok && data.success) {
                ScamLens.showAlert('profileAlertBox', 'Profile updated successfully!', 'success');
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmNewPassword').value = '';
            } else {
                ScamLens.showAlert('profileAlertBox', data.message || 'Failed to update profile.', 'danger');
            }
        } catch (err) {
            ScamLens.showAlert('profileAlertBox', 'Network error while updating profile.', 'danger');
        } finally {
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
