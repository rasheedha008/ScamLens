<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ScamLens Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="cyber-card cyber-card-glow p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="brand-icon d-inline-block mb-3 fs-3 p-3"><i class="fa-solid fa-lock"></i></span>
                    <h3 class="text-white fw-bold">Sign In to ScamLens</h3>
                    <p class="text-secondary small">Access your protected scan history and security analytics</p>
                </div>

                <!-- Alert Messages -->
                <div th:if="${errorMessage}" class="alert alert-danger py-2 small cyber-card mb-3" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-1"></i> <span th:text="${errorMessage}"></span>
                </div>
                <div th:if="${successMessage}" class="alert alert-success py-2 small cyber-card mb-3" role="alert">
                    <i class="fa-solid fa-circle-check me-1"></i> <span th:text="${successMessage}"></span>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label small text-secondary fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@domain.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small text-secondary fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-cyber w-100 py-2 fs-6 mb-3">
                        <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Authenticate & Enter
                    </button>
                </form>

                <div class="p-3 rounded bg-dark border border-secondary mb-3 text-center">
                    <small class="text-muted d-block mb-1">Seeded Demo Account Available:</small>
                    <code class="text-info">demo@scamlens.com</code> / <code class="text-info">password123</code>
                    <button type="button" class="btn btn-sm btn-outline-secondary mt-2 w-100" onclick="fillDemo()">
                        <i class="fa-solid fa-magic-wand-sparkles me-1"></i> Autofill Demo Credentials
                    </button>
                </div>

                <div class="text-center pt-2 border-top border-secondary small">
                    <span class="text-secondary">Don't have an account?</span>
                    <a th:href="@{/register}" class="text-info text-decoration-none fw-semibold ms-1">Create Account</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function fillDemo() {
        document.getElementById('email').value = 'demo@scamlens.com';
        document.getElementById('password').value = 'password123';
    }
</script>
</body>
</html>
