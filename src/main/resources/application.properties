

# ScamLens Application Configuration
spring.application.name=ScamLens
server.port=${PORT:8080}

# Primary MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:scamlens}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rasheedha.rae.2008}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Server & HTTP Limits
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Structured Logging
logging.level.root=INFO
logging.level.com.scamlens=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
